name: Build Windows Desktop App

# Builds Real EstateAppNew.exe (PyInstaller onedir, incl. the SQLite data
# snapshot) and wraps it into an installer with Inno Setup, on a free
# GitHub-hosted Windows runner.
#
# Data snapshot: the analytics database cannot be rebuilt on CI (it needs the
# live DLD backfill), so the workflow downloads dxb.db from the latest release
# tagged data-snapshot-*. If none exists yet it ships a schema-only db and the
# app honestly reports zero coverage. Publish/refresh a snapshot:
#   1. run desktop/export_sqlite.py against the running stack (see README)
#   2. gh release create data-snapshot-v1 desktop/data/dxb.db
# Re-tagging (data-snapshot-v2, v3, ...) makes the newer one "latest by tag
# order" — the workflow sorts and picks the greatest.

on:
  workflow_dispatch:        # manual: Actions tab → Run workflow
  push:
    tags: ["v*"]            # auto on version tags like v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Order matters: dxb-api declares a dxb-core dependency resolved via
          # uv's [tool.uv.sources] path (plain pip ignores it), so install the
          # shared schema package FIRST so its name is already satisfied.
          pip install -e packages/dxb-core
          pip install -e api
          pip install -e mcp
          pip install -e copilot
          pip install -e desktop --no-deps
          pip install -r desktop/requirements-build.txt

      - name: Run desktop tests
        run: python -m pytest desktop/tests -q
        env:
          PYTHONPATH: desktop/src

      - name: Build the SPA
        run: |
          cd ui
          npm install
          npm run typecheck
          npm run build

      - name: Fetch data snapshot (or build schema-only)
        shell: pwsh
        run: |
          # Use --json (not tabular text): the release TITLE is "Data snapshot
          # v1 ..." which would otherwise be mis-parsed as the tag. Only tags
          # matching data-snapshot-* are data releases.
          $snap = gh release list --repo $env:GITHUB_REPOSITORY --limit 50 --json tagName --jq '.[].tagName' |
                  Where-Object { $_ -like 'data-snapshot-*' } |
                  Sort-Object -Culture en-US |
                  Select-Object -Last 1
          if ($snap) {
            Write-Host "Downloading snapshot from release $snap"
            New-Item -Force desktop/data, snapshot -ItemType Directory | Out-Null
            gh release download $snap --repo $env:GITHUB_REPOSITORY --pattern dxb.db --dir snapshot --clobber
            Move-Item -Force snapshot/dxb.db desktop/data/dxb.db
            $mb = [math]::Round((Get-Item desktop/data/dxb.db).Length / 1MB, 1)
            Write-Host "Snapshot size: $mb MB"
          } else {
            Write-Host "No data-snapshot release found — shipping schema-only db"
            python desktop/src/dxb_desktop/make_db.py desktop/data/dxb.db
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build app icon from the SPA favicon
        shell: pwsh
        continue-on-error: true   # icon is cosmetic; never block the build
        run: |
          # Pillow only — cairosvg needs a native cairo dll that is not
          # reliably present on Windows runners. Draw the brand skyline.
          pip install pillow
          python -c @'
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (256, 256), (15, 23, 42))
          d = ImageDraw.Draw(img)
          bars = [(40,140,60,216),(70,96,90,216),(100,120,120,216),(130,64,150,216),(160,120,180,216),(190,88,210,216)]
          for b in bars:
              d.rectangle(b, fill=(212,175,55))
          img.save("desktop/app.ico", format="ICO", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print("icon OK")
          '@

      - name: Build exe with PyInstaller
        run: pyinstaller desktop/real_estate_app.spec --noconfirm --log-level WARN

      - name: Copy data snapshot into the dist tree
        shell: pwsh
        run: |
          # -ItemType Directory is required: plain `New-Item -Force` on a path
          # whose parent exists creates a FILE named `data`, and the copy
          # below then fails with "Could not find a part of the path".
          New-Item -ItemType Directory -Force dist/RealEstateAppNew/data | Out-Null
          Copy-Item desktop/data/dxb.db dist/RealEstateAppNew/data/dxb.db
          # Get-ChildItem, not Get-Item — only Get-ChildItem has -Recurse.
          $size = (Get-ChildItem dist/RealEstateAppNew -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host "App dir size: $([math]::Round($size,1)) MB"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc desktop/installer.iss /Q

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealEstateAppNew-installer
          path: dist/installer/RealEstateAppNew-Setup-*.exe
          if-no-files-found: error

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/RealEstateAppNew-Setup-*.exe
          draft: true
