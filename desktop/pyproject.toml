[project]
name = "dxb-desktop"
version = "1.0.0"
description = "Real Estate App New — Windows desktop packaging of the Dubai analytics stack"
requires-python = ">=3.12"
dependencies = [
    # The sibling services, installed from source (CI does
    # `pip install ../packages/dxb-core ../api ../mcp ../copilot` first).
    "dxb-core",
    "dxb-api",
    "dxb-mcp",
    "dxb-copilot",
    # Runtime for the shell.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
real-estate-app = "dxb_desktop.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dxb_desktop = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
