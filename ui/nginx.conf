# Served BY the ui container itself — distinct from the top-level
# nginx/nginx.conf, which is the edge (TLS, rate limits, routing to every
# service). This one has exactly one job: hand back static files fast.
#
# Listens on 8080, not 80: nginxinc/nginx-unprivileged (see ui/Dockerfile) is
# built to run as a non-root user, and binding <1024 needs root. Every other
# service in this stack already runs as a dedicated non-root user
# (api/Dockerfile, mcp/Dockerfile, copilot/Dockerfile) — this keeps that
# property true for the SPA too, for free, instead of hand-patching a stock
# nginx image's pid/cache/log directory permissions.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        default_type application/json;
    }

    # nginx's stock mime.types maps .js to application/javascript but has no
    # entry at all for .mjs — unmapped extensions fall through to
    # `default_type` (application/octet-stream), and a browser correctly
    # refuses to execute a <script type="module"> or Worker(..., {type:
    # "module"}) whose response isn't a JS MIME type. This is exactly the
    # class of bug that broke the map's tile-loading worker in production —
    # that time from Vite never emitting the file at all, this time from
    # nginx correctly emitting it under the wrong type (docs/UI_PLAN.md,
    # CLAUDE.md).
    #
    # Deliberately NOT a `types {}` block: a `types {}` block REPLACES the
    # inherited type table for its whole context rather than extending it,
    # and nginx's own mime.types FILE is itself a complete `types { ... }`
    # block — nesting an `include` of it inside a hand-written `types {}`
    # here is a syntax error (`unexpected "{"`) that crash-loops the
    # container, and an earlier version of this file instead wrote the .mjs
    # mapping with no `include` at all, which silently wiped out every other
    # mapping (html, css, svg, everything) for the entire server — index.html
    # then served as application/octet-stream too, and the browser offered
    # the whole site as a file download. Both were real, both taught the same
    # lesson: `default_type`, scoped to just this one extension via a
    # location match, touches nothing else and cannot regress anything else.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Hashed filenames from the Vite build (index-<hash>.js) are safe to cache
    # forever — a content change always means a new filename, never a stale
    # cache serving old code silently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: ViewState lives in the query string (docs/UI_PLAN.md §1),
    # so every deep link — /?view=map&gran=areas, /?view=dashboard&ids=292 —
    # is really just index.html with a query string, and must resolve to it
    # rather than 404ing on a path the server doesn't literally have.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
