# Edge for both services: TLS terminates here, and `api` and `mcp` stop
# publishing ports of their own (docs/MCP_DESIGN.md §8).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Real client IP, not the compose bridge address — without this every
    # request appears to come from one host and the rate limits below become a
    # single shared bucket that one noisy client can exhaust for everyone.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip on;
    gzip_types application/json application/geo+json text/plain;
    gzip_min_length 1024;
    # NOT gzipping text/event-stream: compressing a stream defeats the point by
    # buffering it until the compression window fills.

    # ---------------------------------------------------------------- limits
    #
    # Two zones, because the two clients have genuinely different shapes and a
    # single limit cannot serve both. A browser makes a handful of requests per
    # view; an agent fires several tool calls in a burst while reasoning about
    # one question, then goes quiet. Applying browser-shaped limits to agent
    # traffic throttles normal behaviour and looks, from the agent's side, like
    # the data is missing.
    limit_req_zone $binary_remote_addr zone=rest_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=mcp_zone:10m  rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    upstream mcp_upstream {
        server mcp:8100;
        keepalive 32;
    }

    upstream copilot_upstream {
        server copilot:8200;
        keepalive 32;
    }

    upstream ui_upstream {
        server ui:8080;
        keepalive 32;
    }

    # Redirect plain HTTP, except the health check (which a load balancer or
    # compose may probe over HTTP before certificates are in play).
    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            return 200 '{"status":"ok","via":"nginx"}';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Bodies are small on both surfaces: analytics queries are query
        # strings, and a JSON-RPC tool call is a few hundred bytes.
        client_max_body_size 4m;

        limit_conn conn_per_ip 32;

        # proxy_http_version DOES inherit; proxy_set_header does not, which is
        # why the headers live in an included file applied per location rather
        # than being set once here. See nginx/proxy_headers.conf.
        proxy_http_version 1.1;

        # Exempt from rate limiting: it is the compose healthcheck, and a
        # throttled health probe reports a healthy service as down.
        location = /health {
            access_log off;
            return 200 '{"status":"ok","via":"nginx"}';
        }

        # ------------------------------------------------------------ REST
        location /api/ {
            limit_req zone=rest_zone burst=20 nodelay;

            # Strip the /api prefix — the service serves /meta/coverage, not
            # /api/meta/coverage, and rewriting here keeps the public path
            # stable if the internal layout ever changes.
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://api_upstream;
            include /etc/nginx/proxy_headers.conf;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------- MCP
        location /mcp {
            # Generous burst with nodelay: an agent's several-calls-then-quiet
            # pattern is normal, not abuse. The sustained rate still bounds it.
            limit_req zone=mcp_zone burst=30 nodelay;

            proxy_pass http://mcp_upstream;
            include /etc/nginx/proxy_headers.conf;

            # THE deployment bug for this stack. A Streamable HTTP response may
            # upgrade to SSE, and with buffering on, nginx holds the event
            # stream until its buffer fills — so streaming silently stops
            # working while every request still returns 200. Nothing errors;
            # responses just arrive late or not at all.
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # An SSE stream is idle between events by design. The default 60s
            # read timeout would cut a long analytics run mid-answer.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --------------------------------------------------------- COPILOT
        location /copilot/ {
            # Agent-shaped traffic, same reasoning as /mcp: one question can
            # mean several tool round trips in a burst.
            limit_req zone=mcp_zone burst=30 nodelay;

            rewrite ^/copilot/(.*)$ /$1 break;

            proxy_pass http://copilot_upstream;
            include /etc/nginx/proxy_headers.conf;

            # Same SSE requirements as /mcp, for the same reason: /chat streams
            # events, and buffering would hold them until the buffer filled —
            # the answer would appear all at once, long after it was ready, with
            # nothing erroring to explain why.
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------------------------------------------------------- THE UI
        #
        # Proxied to its own container (ui/Dockerfile), not served from a file
        # mount here. The plan first said FastAPI would serve the bundle, then
        # said nginx would serve it from a bind-mounted dist/; both were
        # replaced by a dedicated ui/ image so the exact same container works
        # for local docker-compose testing and for a later cloud deploy,
        # without depending on a host-built dist/ existing on disk. See
        # docs/UI_PLAN.md §2. Caching headers for hashed assets are already set
        # by the ui container's own nginx.conf — nothing to duplicate here.
        location / {
            limit_req zone=rest_zone burst=20 nodelay;

            proxy_pass http://ui_upstream;
            include /etc/nginx/proxy_headers.conf;
        }
    }
}
