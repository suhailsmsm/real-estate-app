# Shared proxy headers, included by EVERY location that proxies.
#
# This file exists because of an nginx rule that is easy to get wrong:
# `proxy_set_header` directives do NOT merge across configuration levels. The
# moment a location defines even one of them, it discards *all* the ones
# inherited from the enclosing server block.
#
# That is exactly what happened here. The `/mcp` location set only
# `Connection ""` for keepalive, which silently dropped the server-level
# `Host $host`. nginx then fell back to the default, `$proxy_host` — the name
# of the upstream block — so the MCP server received `Host: mcp_upstream`,
# failed its DNS-rebinding check, and answered 421 Misdirected Request. The
# REST location had the same latent bug and simply had no Host validation to
# trip over it.
#
# Keeping the full set in one included file means a location cannot pick up
# some of them and lose the rest.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Empty Connection enables keepalive to the upstream (requires HTTP/1.1).
proxy_set_header Connection "";
