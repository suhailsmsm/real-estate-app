[project]
name = "dxb-core"
version = "0.1.0"
description = "Shared SQLAlchemy table definitions for the Dubai real estate star schema"
requires-python = ">=3.12"
# Deliberately minimal: table definitions only, no I/O, no driver, no settings.
# Anything heavier here would be shipped into BOTH the ELT and the API images.
dependencies = [
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dxb_core"]

# Own [tool.ruff] so this shared package is a config root in its own right:
# ruff resolves config per file by walking up from the file, so without this
# the models would silently fall back to ruff's defaults instead of the E/I
# rules the rest of the solution uses. TID is intentionally omitted — the
# api-only layering ban does not apply here.
[tool.ruff]
lint.select = ["E", "I"]
