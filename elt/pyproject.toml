[project]
name = "dxb"
version = "0.1.0"
description = "Dubai real estate analytics — ELT service (DLD open data -> Postgres star schema)"
requires-python = ">=3.12"
dependencies = [
    "dxb-core",
    "httpx>=0.27",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "tenacity>=9.0",
    "typer>=0.15",
    "apscheduler>=3.10,<4",
    "questionary>=2.0",
]

[tool.uv.sources]
dxb-core = { path = "../packages/dxb-core", editable = true }

[project.scripts]
dxb = "dxb.cli:app"

[project.optional-dependencies]
# mirrors [dependency-groups.dev] below — pip (Dockerfile) reads extras, not
# PEP 735 groups; uv sync reads dependency-groups natively. Keep in sync.
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dxb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
lint.select = ["E", "I"]
